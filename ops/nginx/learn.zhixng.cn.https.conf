server {
    listen 80;
    listen [::]:80;
    server_name learn.zhixng.cn;
    server_tokens off;

    location = /_healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://learn.zhixng.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name learn.zhixng.cn;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/learn.zhixng.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn.zhixng.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/gogogo/current;
    index index.html;

    access_log /var/log/nginx/gogogo-access.log;
    error_log /var/log/nginx/gogogo-error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /_healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        try_files /index.html =404;
        expires -1;
    }

    location = /course {
        try_files /course.html =404;
        expires -1;
    }

    location = /course/ {
        return 308 /course;
    }

    location ~* \.(?:css|js|webp|woff2?)$ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
}
