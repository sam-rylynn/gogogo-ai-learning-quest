server {
    listen 80;
    listen [::]:80;
    server_name learn.zhixng.cn;
    server_tokens off;

    root /srv/gogogo/current;
    index index.html;

    access_log /var/log/nginx/gogogo-access.log;
    error_log /var/log/nginx/gogogo-error.log;

    location = /_healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location = / {
        try_files /index.html =404;
        expires -1;
    }

    location = /course {
        try_files /course.html =404;
        expires -1;
    }

    location = /course/ {
        return 308 /course;
    }

    location ~* \.(?:css|js|webp|woff2?)$ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
}
