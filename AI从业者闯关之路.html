<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOGO GO · AI 从业者闯关之路 v2</title>
<style>
  :root{
    --bg:#0e1120; --bg2:#141a30; --card:#1a2138; --card2:#212a4a;
    --line:#2c3558; --txt:#eef1fb; --txt2:#9aa5c8; --txt3:#6b76a0;
    --accent:#7c6cff; --accent2:#39d0d8; --gold:#ffc94d; --green:#3ddc97;
    --red:#ff6b81; --blue:#5b9cff; --orange:#ff9f5b;
    --grad:linear-gradient(135deg,#7c6cff,#39d0d8);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--txt);overscroll-behavior:none}
  #app{max-width:560px;margin:0 auto;min-height:100%;position:relative;padding-bottom:76px}

  header{padding:18px 18px 6px;position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,var(--bg) 75%,transparent)}
  .hd-row{display:flex;align-items:center;justify-content:space-between}
  .logo{font-size:18px;font-weight:800;letter-spacing:.5px}
  .logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .xp-pill{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700}
  .xp-pill b{color:var(--gold)}
  .title-bar{margin-top:8px}
  .rank-name{font-size:13px;color:var(--txt2);display:flex;justify-content:space-between}
  .rank-name b{color:var(--txt)}
  .xpbar{height:6px;background:var(--card);border-radius:99px;margin-top:5px;overflow:hidden}
  .xpbar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .5s}

  nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;
    display:flex;background:rgba(20,26,48,.96);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;background:none;border:none;color:var(--txt3);font-size:11px;padding:9px 0 8px;
    display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:inherit;position:relative}
  nav button .ic{font-size:20px;line-height:1}
  nav button.on{color:var(--accent2)}
  nav button .bdg{position:absolute;top:4px;right:calc(50% - 22px);background:var(--red);color:#fff;
    font-size:9px;font-weight:800;border-radius:99px;padding:1px 5px;min-width:15px}
  .page{display:none;padding:6px 16px 30px;animation:fadein .25s}
  .page.on{display:block}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .map-wrap{position:relative;padding:10px 0 20px}
  .map-line{position:absolute;left:50%;top:0;bottom:0;width:3px;transform:translateX(-50%);
    background:repeating-linear-gradient(180deg,var(--line) 0 8px,transparent 8px 16px)}
  .lv-row{position:relative;display:flex;margin:18px 0;min-height:96px;align-items:center}
  .lv-row .dot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;
    border-radius:50%;background:var(--card);border:3px solid var(--line);z-index:2}
  .lv-row.done .dot{background:var(--green);border-color:var(--green);box-shadow:0 0 12px rgba(61,220,151,.6)}
  .lv-row.open .dot{background:var(--accent);border-color:var(--accent);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 6px rgba(124,108,255,.5)}50%{box-shadow:0 0 16px rgba(124,108,255,.95)}}
  .lv-card{width:46%;background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:13px 13px 11px;cursor:pointer;transition:transform .15s;position:relative}
  .lv-card:active{transform:scale(.97)}
  .lv-row:nth-child(odd) .lv-card{margin-right:auto}
  .lv-row:nth-child(even) .lv-card{margin-left:auto}
  .lv-row.boss{justify-content:center}
  .lv-row.boss .lv-card{width:78%;margin:0 auto;border-color:#5a4a12;
    background:linear-gradient(160deg,#2a2340,#1a2138)}
  .lv-row.open .lv-card{border-color:var(--accent)}
  .lv-row.done .lv-card{border-color:rgba(61,220,151,.5)}
  .lv-row.locked .lv-card{opacity:.55;filter:saturate(.4)}
  .lv-ic{font-size:26px;margin-bottom:4px}
  .lv-wk{font-size:10px;color:var(--txt3);font-weight:700;letter-spacing:.5px}
  .lv-tt{font-size:14px;font-weight:800;margin:2px 0 6px;line-height:1.35}
  .lv-meta{font-size:11px;color:var(--txt2);display:flex;flex-wrap:wrap;gap:3px 8px}
  .lv-meta .ok{color:var(--green)}
  .stars{color:var(--gold);font-size:12px;letter-spacing:1px}
  .map-tip{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:11px 14px;
    font-size:12.5px;color:var(--txt2);line-height:1.7;margin-bottom:4px}
  .map-tip b{color:var(--accent2)}

  .layer{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
  .layer-hd{padding:12px 14px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .layer-hd h3{font-size:14.5px;font-weight:800}
  .layer-hd .sub{font-size:11px;color:var(--txt3);margin-top:2px}
  .layer-pct{font-size:12px;font-weight:800;white-space:nowrap}
  .layer-bar{height:5px;background:var(--bg);margin:0 14px}
  .layer-bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px 14px}
  .chip{font-size:12px;padding:7px 11px;border-radius:999px;border:1px solid var(--line);
    color:var(--txt3);background:var(--bg2);cursor:pointer;user-select:none;transition:all .15s;line-height:1.3}
  .chip.s1{color:var(--blue);border-color:rgba(91,156,255,.55);background:rgba(91,156,255,.1)}
  .chip.s2{color:var(--green);border-color:rgba(61,220,151,.55);background:rgba(61,220,151,.1)}
  .chip:active{transform:scale(.95)}
  .tree-legend{display:flex;gap:14px;font-size:11.5px;color:var(--txt2);margin:2px 2px 12px;flex-wrap:wrap}
  .tree-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}

  .today-hd{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 12px}
  .today-hd .d{font-size:15px;font-weight:800}
  .streak{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 13px;
    font-size:13px;font-weight:800;color:var(--gold)}
  .step{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:13px 14px;margin-bottom:10px;cursor:pointer;transition:all .15s}
  .step:active{transform:scale(.98)}
  .step.ck{border-color:rgba(61,220,151,.5);background:rgba(61,220,151,.07)}
  .step .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
  .step.ck .box{background:var(--green);border-color:var(--green)}
  .step .tt{font-size:13.5px;font-weight:700}
  .step .ds{font-size:11.5px;color:var(--txt2);margin-top:2px;line-height:1.5}
  .step .min{margin-left:auto;font-size:11px;font-weight:800;color:var(--accent2);
    background:rgba(57,208,216,.12);padding:4px 8px;border-radius:8px;flex-shrink:0}
  .sec-tt{font-size:13px;font-weight:800;color:var(--txt2);margin:20px 2px 10px;letter-spacing:.5px}
  .done-banner{background:rgba(61,220,151,.12);border:1px solid rgba(61,220,151,.4);color:var(--green);
    border-radius:14px;padding:12px 14px;font-size:13px;font-weight:700;text-align:center;margin-bottom:12px}
  .review-cta{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(124,108,255,.18),rgba(57,208,216,.12));
    border:1px solid var(--accent);border-radius:14px;padding:14px;margin-bottom:12px;cursor:pointer}
  .review-cta .n{font-size:24px;font-weight:800;color:var(--accent2)}
  .review-cta .t{font-size:13.5px;font-weight:700}
  .review-cta .s{font-size:11.5px;color:var(--txt2);margin-top:2px}

  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 8px;text-align:center}
  .stat b{font-size:20px;display:block}
  .stat span{font-size:11px;color:var(--txt3)}
  .plist{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px}
  .prow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px}
  .prow:last-child{border-bottom:none}
  .prow .st{margin-left:auto;font-size:11.5px;font-weight:700}
  .btn{display:block;width:100%;border:none;border-radius:14px;padding:14px;font-size:14.5px;font-weight:800;
    cursor:pointer;font-family:inherit;margin-bottom:10px;transition:transform .12s}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--grad);color:#0c0f1d}
  .btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--line)}
  .btn.danger{background:none;color:var(--red);border:1px solid rgba(255,107,129,.4)}
  .btn:disabled{opacity:.45}
  textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:var(--txt);
    font-size:13px;padding:12px;font-family:inherit;margin-bottom:10px;resize:vertical;line-height:1.7}
  textarea.code{font-family:Menlo,Consolas,monospace;font-size:12px}

  .mask{position:fixed;inset:0;background:rgba(5,7,16,.78);backdrop-filter:blur(3px);z-index:50;
    display:none;align-items:flex-end;justify-content:center}
  .mask.on{display:flex}
  .sheet{width:100%;max-width:560px;max-height:90vh;background:var(--bg2);border-radius:22px 22px 0 0;
    overflow-y:auto;padding:20px 18px calc(24px + env(safe-area-inset-bottom));animation:up .28s}
  @keyframes up{from{transform:translateY(60px);opacity:.5}to{transform:none;opacity:1}}
  .sheet-grab{width:40px;height:4px;background:var(--line);border-radius:99px;margin:0 auto 16px}
  .sheet h2{font-size:18px;font-weight:800;line-height:1.4}
  .sheet .wk{font-size:11.5px;color:var(--accent2);font-weight:800;letter-spacing:1px;margin-bottom:4px}
  .goalbox{background:var(--card);border-radius:14px;padding:12px 14px;margin:14px 0 0;font-size:13px;
    color:var(--txt2);line-height:1.8}
  .goalbox b{color:var(--txt);display:block;font-size:12.5px;margin-bottom:4px}
  .evbox{background:rgba(255,201,77,.08);border:1px solid rgba(255,201,77,.35);border-radius:14px;
    padding:12px 14px;margin-top:14px;font-size:12.5px;line-height:1.7;color:#e8d8ae}
  .evbox b{color:var(--gold)}
  .phase-tt{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;margin:20px 2px 10px}
  .phase-tt .pn{background:var(--card2);border-radius:8px;padding:2px 8px;font-size:11px;color:var(--accent2)}
  .lock-note{font-size:11.5px;color:var(--txt3);margin:-4px 2px 10px}
  .row-item{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
    border-radius:13px;padding:12px 13px;margin-bottom:8px;cursor:pointer;font-size:13px;line-height:1.5}
  .row-item:active{transform:scale(.985)}
  .row-item .ric{font-size:19px;flex-shrink:0}
  .row-item .rst{margin-left:auto;font-size:11px;font-weight:800;flex-shrink:0}
  .row-item.doneR{border-color:rgba(61,220,151,.45)}
  .row-item.lockedR{opacity:.5}
  .lesson-body{font-size:14px;line-height:1.9;color:var(--txt);margin-top:14px}
  .lesson-body .ana{background:rgba(57,208,216,.09);border-left:3px solid var(--accent2);
    padding:10px 13px;border-radius:0 12px 12px 0;margin:12px 0;font-size:13px;color:var(--txt2);line-height:1.8}
  .lesson-body .exm{background:rgba(255,159,91,.08);border-left:3px solid var(--orange);
    padding:10px 13px;border-radius:0 12px 12px 0;margin:12px 0;font-size:13px;color:var(--txt2);line-height:1.8}
  .lesson-body .wrn{background:rgba(255,107,129,.08);border-left:3px solid var(--red);
    padding:10px 13px;border-radius:0 12px 12px 0;margin:12px 0;font-size:13px;color:var(--txt2);line-height:1.8}
  .lesson-body b{color:var(--accent2)}
  .lesson-body .ana b{color:var(--accent2)} .lesson-body .exm b{color:var(--orange)} .lesson-body .wrn b{color:var(--red)}

  .q-prog{display:flex;gap:5px;margin:14px 0 16px}
  .q-prog i{flex:1;height:4px;border-radius:99px;background:var(--line)}
  .q-prog i.cur{background:var(--accent)} .q-prog i.ok{background:var(--green)} .q-prog i.bad{background:var(--red)}
  .q-text{font-size:15.5px;font-weight:700;line-height:1.65;margin-bottom:16px}
  .opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);
    color:var(--txt);border-radius:13px;padding:13px 14px;font-size:13.5px;margin-bottom:9px;cursor:pointer;
    font-family:inherit;line-height:1.55;transition:all .15s}
  .opt:active{transform:scale(.98)}
  .opt.right{border-color:var(--green);background:rgba(61,220,151,.12);color:var(--green)}
  .opt.wrong{border-color:var(--red);background:rgba(255,107,129,.1);color:var(--red)}
  .opt.pickedCat{border-color:var(--accent)}
  .opt:disabled{cursor:default}
  .explain{background:var(--card);border-left:3px solid var(--accent2);border-radius:0 12px 12px 0;
    padding:11px 13px;font-size:12.5px;color:var(--txt2);line-height:1.7;margin:4px 0 14px;animation:fadein .3s}
  .explain b{color:var(--accent2)}
  .result-emoji{font-size:52px;text-align:center;margin:10px 0}
  .result-tt{font-size:20px;font-weight:800;text-align:center;margin-bottom:6px}
  .result-sub{font-size:13px;color:var(--txt2);text-align:center;line-height:1.7;margin-bottom:18px}

  .item-card{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:16px 15px;
    font-size:14.5px;font-weight:700;line-height:1.7;margin-bottom:14px;min-height:74px;
    display:flex;align-items:center;justify-content:center;text-align:center}
  .cat-row{display:flex;flex-wrap:wrap;gap:8px}
  .cat-btn{flex:1;min-width:30%;background:var(--card);border:1.5px solid var(--line);color:var(--txt);
    border-radius:12px;padding:12px 8px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;
    transition:all .15s;line-height:1.4}
  .cat-btn:active{transform:scale(.96)}
  .cat-btn.right{border-color:var(--green);background:rgba(61,220,151,.14);color:var(--green)}
  .cat-btn.wrong{border-color:var(--red);background:rgba(255,107,129,.12);color:var(--red)}
  .mistake-tag{font-size:11.5px;color:var(--txt3);text-align:right;margin-bottom:8px}
  .mistake-tag b{color:var(--red)}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .shake{animation:shake .3s}

  .order-done{background:var(--card);border:1px solid rgba(61,220,151,.4);border-radius:12px;
    padding:9px 13px;font-size:12.5px;color:var(--green);margin-bottom:7px;line-height:1.5}
  .pool{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .pool .opt{margin-bottom:0}
  .pool .opt.usedS{opacity:.25;pointer-events:none}

  .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .m-cell{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 10px;
    font-size:12px;line-height:1.5;cursor:pointer;transition:all .15s;color:var(--txt)}
  .m-cell.sel{border-color:var(--accent);background:rgba(124,108,255,.12)}
  .m-cell.okM{border-color:rgba(61,220,151,.5);background:rgba(61,220,151,.09);color:var(--txt3);pointer-events:none}
  .m-cell:active{transform:scale(.97)}

  .rub{display:flex;gap:9px;align-items:flex-start;background:var(--card);border-radius:11px;
    padding:10px 12px;margin-bottom:7px;font-size:12.5px;line-height:1.6}
  .rub .ri{flex-shrink:0;font-size:14px}
  .rub.okR{border-left:3px solid var(--green)} .rub.noR{border-left:3px solid var(--red);color:var(--txt2)}

  .fc{background:var(--card2);border:1px solid var(--line);border-radius:18px;min-height:190px;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:22px 18px;
    font-size:15.5px;font-weight:700;line-height:1.8;margin:14px 0}
  .fc.back-side{border-color:var(--accent2);font-weight:500;font-size:14px;color:var(--txt2)}
  .fc-meta{font-size:11.5px;color:var(--txt3);text-align:center;margin-bottom:4px}
  .fc-btns{display:flex;gap:10px}
  .fc-btns .btn{flex:1}
  .btn.forget{background:rgba(255,107,129,.12);color:var(--red);border:1px solid rgba(255,107,129,.4)}
  .btn.remember{background:rgba(61,220,151,.14);color:var(--green);border:1px solid rgba(61,220,151,.5)}

  .confetti{position:fixed;top:-10px;z-index:99;font-size:22px;animation:fall linear forwards;pointer-events:none}
  @keyframes fall{to{transform:translateY(105vh) rotate(600deg);opacity:.6}}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2b3358;color:#fff;
    padding:10px 18px;border-radius:99px;font-size:13px;font-weight:700;z-index:99;opacity:0;
    transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
  .toast.on{opacity:1}
</style>
<style>
  .codex-checkin{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;align-items:center;gap:8px;
    padding:11px 14px;border:1px solid rgba(57,208,216,.48);border-radius:999px;background:rgba(12,19,36,.94);
    color:#baf6ef;font:800 12px/1 inherit;cursor:pointer;box-shadow:0 10px 28px rgba(0,0,0,.28)}
  .codex-checkin:hover{transform:translateY(-2px);border-color:#39d0d8}
  .note-panel{margin-top:18px;padding:16px;border:1px solid rgba(57,208,216,.34);border-radius:14px;
    background:rgba(57,208,216,.06)}
  .note-panel h3{margin:0 0 5px;color:var(--accent2);font-size:17px}
  .note-panel .note-sub{color:var(--txt2);font-size:12px;line-height:1.65;margin-bottom:12px}
  .note-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .note-field{display:block;color:var(--txt2);font-size:12px;font-weight:700}
  .note-field textarea{display:block;width:100%;height:88px;margin-top:5px;padding:10px;border:1px solid var(--line);
    border-radius:10px;background:var(--bg2);color:var(--txt);font:13px/1.65 inherit;resize:vertical}
  .note-field textarea:focus{outline:none;border-color:var(--accent2)}
  .note-state{margin-top:10px;color:var(--txt2);font-size:12px}
  .note-state.ok{color:var(--green)}
  @media(max-width:600px){
    .codex-checkin{right:12px;bottom:12px;padding:10px 12px}
    .note-grid{grid-template-columns:1fr}
  }
</style>

<body>
<button class="codex-checkin" id="codexCheckin" type="button">⌘ 复制学习快照给 Codex</button>
<div id="app">
  <header>
    <div class="hd-row">
      <div class="logo">GOGO GO · <span>AI 从业者闯关之路</span></div>
      <div class="xp-pill">⚡ <b id="xpNum">0</b> XP</div>
    </div>
    <div class="title-bar">
      <div class="rank-name"><span>当前称号：<b id="rankName">见习生</b></span><span id="rankNext"></span></div>
      <div class="xpbar"><i id="xpBar" style="width:0%"></i></div>
    </div>
  </header>

  <div class="page on" id="pg-map">
    <div class="map-tip" id="mapTip"></div>
    <div class="map-wrap" id="mapWrap"><div class="map-line"></div></div>
  </div>

  <div class="page" id="pg-tree">
    <div class="tree-legend">

{ id:"l2", icon:"🐍", weeks:"第 3–4 周", title:"Python · JSON · API · HTTP · Git",

  lessons:[

    body:'程序间对话遵循 HTTP：一方发<b>请求（Request）</b>，另一方回<b>响应（Response）</b>。响应带<b>状态码</b>：200 成功、404 资源不存在、500 服务器内部错误、超时则是规定时间内没等到回音。常用方法：<b>GET 取数据，POST 交数据</b>。'
    +'<div class="ana"><b>类比</b>：点外卖。下单=发请求；餐送到=200；店铺不存在=404；厨房着火做不出来=500；骑手失联=超时（注意：失联不代表餐没做！）。看菜单=GET，下订单=POST。</div>'

   {t:"超时与幂等键：你已经懂的工程难题",

    card:["Git 的三个核心动作和好 commit 信息的标准？","add 选中改动 → commit 存档并写说明 → log 查看历史。好的 commit 说明「改了什么、为什么」，如：修复超时后未复用幂等键的问题。"]}

{ id:"l3", icon:"📊", weeks:"第 5–6 周", title:"机器学习基础",
  goal:"能解释训练 / 验证 / 测试、过拟合，以及为什么指标选择比准确率更重要。",
  lessons:[
   {t:"三套卷子：训练、验证、测试",
    body:'机器学习 = 让系统从数据学规律。数据要分三份：<b>训练集</b>（学习用）、<b>验证集</b>（调参用）、<b>测试集</b>（最终考核，只用一次）。'
    +'<div class="ana"><b>类比</b>：练习册（训练集）反复做；模拟考（验证集）决定复习策略；高考（测试集）只考一次。拿高考真题当练习册，分数就不可信了——这叫数据泄漏。</div>'
    +'<div class="exm"><b>宠物场景</b>：预测会员流失，用 1–10 月数据训练、11 月验证调参、12 月测试。不能反过来用 12 月训练去预测 11 月。</div>',
    card:["训练集 / 验证集 / 测试集各自的用途？","训练集：学规律；验证集：调参和选模型；测试集：最终考核，只用一次。用测试集调参=数据泄漏，成绩不可信。"]},
   {t:"过拟合：背题的学霸上考场就崩",
    body:'<b>过拟合（Overfitting）</b>：模型把训练数据背得太死，学到了噪声而不是规律，遇到新数据就崩。信号：训练集分数很高、测试集分数掉得厉害。反面是<b>欠拟合</b>：连训练集都学不好，模型太简单。'
    +'<div class="ana"><b>类比</b>：背熟了练习册每道题的答案（包括印刷错误），换个数字就不会做了。</div>'
    +'<div class="exm"><b>判断口诀</b>：训练好+测试差=过拟合；训练差+测试差=欠拟合；训练好+测试好=刚刚好。</div>',
    card:["如何用训练/测试表现判断过拟合与欠拟合？","训练好+测试差=过拟合（背题）；训练差+测试差=欠拟合（没学会）；训练好+测试好=泛化良好。"]},
   {t:"分类与回归：预测类别还是预测数字",
    body:'监督学习两大任务：<b>分类</b>输出类别（会/不会复购、是/不是过敏体质），<b>回归</b>输出连续数值（下月销量、预计客单价）。判断方法就一句话：<b>答案是选项还是数字？</b>'
    +'<div class="exm"><b>宠物场景</b>：判断会员会不会流失=分类；预测这只柯基的理想日粮克数=回归；识别照片里是猫还是狗=分类；预测双十一销售额=回归。</div>',
    card:["分类和回归的判断标准？","看输出：答案是类别/选项 → 分类；答案是连续数字 → 回归。"]},
   {t:"准确率陷阱：95 分的模型可能一无是处",
    body:'类别不平衡时准确率会骗人：如果 95% 的样本是"健康"，模型无脑全答"健康"就有 95% 准确率——但一个病例都没查出来。要看<b>精确率</b>（说有事的里面多少真有事）和<b>召回率</b>（真有事的里面抓住了多少），按业务代价取舍。'
    +'<div class="exm"><b>宠物场景</b>：过敏食材筛查要高召回率——宁可错杀（多标记疑似过敏原让人复核），不可放过（漏一个就是硬性失败）。营销短信推送要高精确率——错发太多会被拉黑。</div>'
    +'<div class="wrn"><b>连接你已学的</b>：这就是 Evals 思维在 ML 的源头——指标必须匹配业务代价，演示分数会骗人。</div>',
    card:["为什么高准确率可能毫无意义？精确率和召回率怎么选？","类别不平衡时无脑猜多数类也有高准确率。召回率=真有事的抓住多少（漏掉代价大时优先，如过敏筛查）；精确率=报警的有多少是真的（误报代价大时优先，如营销推送）。"]}
  ],

{ id:"l4", icon:"🧠", weeks:"第 7–8 周", title:"神经网络与 Transformer 心智模型",
  goal:"能用自己的话解释 LLM 如何处理输入并生成输出。",
  lessons:[
   {t:"Token：模型眼里的乐高积木",
    body:'模型不按"字"或"词"读文字，而是切成<b>Token（词元）</b>——可能是一个字、半个词或一个词组。上下文窗口的容量、API 计费、生成速度都以 token 为单位。'
    +'<div class="ana"><b>类比</b>：乐高积木。一句话拆成标准积木块，模型只认积木不认整句。「宠物鲜食」可能被切成「宠物」+「鲜」+「食」三块。</div>'
    +'<div class="exm"><b>直觉校准</b>：中文 1 个字 ≈ 1–2 个 token；英文 1 个单词 ≈ 1–1.3 个 token。这解释了为什么长文档又贵又慢。</div>',
    card:["什么是 Token？它和费用、上下文窗口什么关系？","模型处理文字的基本单位（字/词片段）。上下文窗口容量、API 计费、生成速度都按 token 计算。中文约 1 字=1–2 token。"]},
   {t:"Embedding：给语义装上坐标",
    body:'<b>Embedding（向量嵌入）</b>把内容转成一串数字（向量），语义相近的内容坐标就近。这是 RAG 检索的引擎：「狗狗拉肚子」能匹配到「犬类腹泻护理」，靠的不是关键词而是语义距离。'
    +'<div class="ana"><b>类比</b>：城市地图坐标。「猫粮」和「宠物食品」是隔壁小区；「猫粮」和「汽车轮胎」隔了一个城市。有了坐标，"找附近"变成了数学题。</div>',
    card:["Embedding 是什么？它和 RAG 检索什么关系？","把内容转成数值向量，语义相近则向量距离近。RAG 靠它实现语义检索——「狗狗拉肚子」能匹配「犬类腹泻护理」。"]},
   {t:"Attention：阅读时的荧光笔",
    body:'生成每个 token 时，<b>Attention（注意力）机制</b>给上下文中不同位置分配不同权重——相关的部分权重高。这是 Transformer 的核心创新：不是平均地看所有内容，而是动态决定看哪里。'
    +'<div class="ana"><b>类比</b>：做阅读理解。回答「作者为什么难过」时，你的目光自动锁定第三段那句关键话，其他段落权重降低。Attention 就是模型的这种"目光聚焦"。</div>'
    +'<div class="wrn"><b>连接你已学的</b>：上下文塞太满时重要信息被淹没——因为注意力被大量无关内容稀释了。这就是上下文工程的底层原理。</div>',
    card:["Attention 机制做什么？它如何解释「上下文塞太满会变笨」？","生成每个 token 时给上下文不同位置分配注意力权重，聚焦相关部分。塞太满=注意力被无关内容稀释，重要信息被淹没。"]},
   {t:"生成循环：一场超大规模的文字接龙",
    body:'LLM 的完整流程：文本 → 切成 token → 转成向量 → Attention 计算 → <b>预测下一个 token 的概率分布</b> → 选一个输出 → 把它加进上下文 → 重复。它是概率系统：流畅 ≠ 正确，同题可能不同答，可能编造来源——幻觉是这个机制的天然副产品。'
    +'<div class="ana"><b>类比</b>：世界上最强的接龙选手。读过海量文本后，它接的每个词都"最像人话"，但它并不在数据库里查证事实——它在算概率。</div>'
    +'<div class="exm"><b>这解释了</b>：为什么关键金额要程序直接显示（模型重新生成一遍 680 可能变 860）；为什么要 RAG 和工具提供事实依据。</div>',
    card:["用一句话说清 LLM 如何生成回答，以及幻觉为什么是天然副产品？","把输入切 token 转向量，经 Attention 计算后反复预测下一个最可能的 token。它算的是概率不是查事实，所以流畅≠正确，编造来源（幻觉）是机制的天然副产品。"]}
  ],

{ id:"l5", icon:"🔌", weeks:"第 9–10 周", title:"LLM API · RAG · 工具调用实战",
  goal:"能判断什么信息进入上下文、什么必须调用工具，并亲手实现。",
  lessons:[
   {t:"RAG 流水线与它的四种死法",
    body:'RAG 流程：用户问题 → 在知识库<b>检索</b>相关片段 → 片段放入上下文 → 模型<b>依据片段</b>回答 → 返回<b>引用</b>。四种失败：文档过期、切分破坏语义、检索找错片段、模型没忠实引用。'
    +'<div class="ana"><b>类比</b>：开卷考试。先翻书找到相关页（检索），照着写答案（生成），注明页码（引用）。书是旧版（过期）、撕页撕断了句子（切分）、翻错章节（检索错）、看着书还瞎写（不忠实）——四种死法。</div>'
    +'<div class="exm"><b>政策更新五步</b>：更新权威源 → 标版本和生效日期 → 停用旧版 → 重新索引 → 清缓存跑测试。少一步都可能答旧政策。</div>',
    card:["RAG 的四种典型失败方式和政策更新五步？","失败：文档过期/切分破坏语义/检索错片段/模型不忠实引用。更新：改权威源→标版本→停旧版→重新索引→清缓存跑测试。"]},
   {t:"事实来源：谁说了算",
    body:'<b>Source of Truth（事实来源）</b>=某类数据的最终权威系统。信息优先级：<b>实时 API > 规则配置 > RAG 版本化文档 > Agent Memory > 模型旧知识</b>。模型本身通常不是事实来源。'
    +'<div class="exm"><b>你笔记里的经典案例</b>：RAG 价目表 99 元 vs API 返回 109 元 → 按 109 结算并报告知识库过期；昨天有库存+今天工具挂了 → 不能声称今天有货。</div>'
    +'<div class="wrn"><b>口诀</b>：越实时越权威，越陈旧越只能参考。资料"在内部"不代表比实时 API 新。</div>',
    card:["信息权威优先级从高到低是？","实时 API > 当前规则配置 > RAG 版本化文档 > Agent Memory > 模型参数旧知识。模型本身通常不是事实来源。"]},
   {t:"工具调用：模型点菜，后厨做菜",
    body:'<b>工具调用</b>=模型请求外部程序查询或执行：模型决定"需要调什么、传什么参数"，工具返回真实数据，模型基于结果回答。可靠 Agent 还需要：状态管理、工具边界、失败恢复、权限控制、人工确认、可追踪日志。'
    +'<div class="ana"><b>类比</b>：服务员点菜。顾客说"来份熟的"（模糊需求）→ 服务员翻译成标准菜单项（结构化调用）→ 后厨做菜（工具执行）→ 服务员端上来并如实报菜名（忠实引用）。服务员自己下厨（模型编数据）就出事了。</div>'
    +'<div class="exm"><b>验证要点</b>：工具返回 680，模型必须说 680。测试时专门检查这条——就是你学过的工具结果忠实性。</div>',
    card:["工具调用中模型、工具各自负责什么？可靠 Agent 还需要哪些配套？","模型：决定调什么、传参数、忠实引用结果；工具：返回真实数据/执行动作。配套：状态管理、边界、失败恢复、权限、人工确认、日志。"]},
   {t:"结构化输出 + Schema 验证：给生成上保险",
    body:'要求模型输出固定字段的 JSON，程序才能读。但<b>结构完整 ≠ 事实正确</b>：JSON 里照样可能有幻觉。所以要两道保险：<b>Schema 验证</b>（字段、类型、格式对不对）+ <b>事实校验</b>（关键值和权威系统核对）。'
    +'<div class="exm"><b>宠物场景</b>：模型输出 {"balance": 860}，Schema 验证通过（是数字没错），但事实校验发现 API 返回 680 → 拦截。两道保险缺一不可。</div>',
    card:["为什么 Schema 验证通过还不够？","Schema 只查结构（字段/类型/格式），不查事实。JSON 里照样可能幻觉，关键值必须再和权威系统核对（事实校验）。"]}
  ],

{ id:"l6", icon:"🏆", weeks:"第 11–12 周 · BOSS 关", title:"小型 AI 产品 · 岗位方向验证",
  goal:"做出可运行原型（含测试集、失败记录、用户反馈），完成第一次职业方向选择。",
  lessons:[
   {t:"从演示到可靠：从业者的分界线",
    body:'爱好者做 Demo，从业者做<b>可测、可控、可上线的系统</b>。差距就是四样东西：<b>测试集</b>（不是跑一次看看）、<b>失败记录</b>（定位错在 Prompt/检索/工具/代码/产品哪一层）、<b>安全边界</b>（硬性失败清单）、<b>真实用户反馈</b>（不是自己觉得好用）。'
    +'<div class="exm"><b>你的毕业标准</b>：能说清"自己做了什么、AI 做了什么、为什么接受或修改 AI 的方案"——这就是不可替代的专业壁垒。</div>',
    card:["Demo 和可靠系统之间差哪四样东西？","测试集、失败记录（分层定位原因）、安全边界（硬性失败清单）、真实用户反馈。"]},
   {t:"用户访谈：你的十年经验开始变现",
    body:'技术学两个月只是入门，但<b>需求发现</b>你已经练了十年。访谈要领：问<b>过去的具体行为</b>（上次怎么处理的）而不是未来的意愿（你会不会用）；记录<b>当前工作流</b>的完整步骤；找<b>高频、可验证、不涉无审核医疗建议</b>的问题。'
    +'<div class="ana"><b>类比</b>：你做商业地产招商时的商户访谈——问流水和动线，不问"你觉得这里好不好"。方法完全通用。</div>'
    +'<div class="wrn"><b>常见陷阱</b>："你会不会用 AI 推荐食谱？"（意愿题，答案无效）→ "上次给狗狗换粮，你是怎么决定的？"（行为题，金矿）。</div>',
    card:["用户访谈的黄金法则是什么？","问过去的具体行为，不问未来的意愿。「上次你是怎么处理的」比「你会不会用」有效一百倍。"]},
   {t:"方案对比：不用 AI 也是一种方案",
    body:'验证问题后，对比至少三种方案：<b>不用 AI</b>（固定流程+规则能不能解决）、<b>只用搜索/RAG</b>、<b>用 Agent</b>。为每种建立质量、安全和商业指标再选。很多问题规则就够了——知道"这里不需要 AI"正是技术判断力的证明。'
    +'<div class="exm"><b>宠物场景</b>：会员余额提醒——定时任务+短信就够，不需要 AI；个性化换粮过渡方案——需要理解狗狗情况，AI 有价值；退款审批——规则引擎+人工，AI 只做解释。</div>',
    card:["拿到一个业务问题，应该对比哪三类方案？","① 不用 AI（规则+流程）② 只用搜索/RAG ③ 用 Agent。分别建立质量、安全、商业指标再选。「这里不需要 AI」也是专业判断。"]},
   {t:"岗位验证：用证据而不是感觉做选择",
    body:'12 周结束时回答一个问题：你在<b>产品</b>（问题定义、指标、优先级）、<b>设计</b>（交互状态、原型、审美）、<b>工程</b>（代码、调试、系统）三条线上，哪条<b>做起来最顺、证据最强、愿意持续投入</b>？用两个真实项目的表现回答，不用想象回答。'
    +'<div class="exm"><b>证据形式</b>：产品线看你的指标设计和取舍记录；设计线看你的状态设计和原型；工程线看你的代码提交和失败修复记录。三份摊开，答案通常很明显。</div>',
    card:["如何科学地做第一次职业方向选择？","用两个真实项目在产品/设计/工程三条线的表现证据对比：哪条做起来最顺、产出证据最强、愿意持续投入。用证据回答，不用感觉回答。"]}

/* ================= state ================= */
var KEY="gogogo_ai_quest_v2";
var OLDKEY="gogogo_ai_quest_v1";
var S=null;
function freshState(){
  var s={xp:0,levels:{},skills:{},cards:{},extraCards:[],
    lessonNotes:{},
    daily:{date:"",steps:[false,false,false,false]},streak:0,lastFull:"",
    weekly:{key:"",items:[false,false,false,false]},intro:false};
  GAME_DATA.levels.forEach(function(l){
    s.levels[l.id]={les:l.lessons.map(function(){return false;}),
      ex:l.exercises.map(function(){return {p:false,m:-1};}),quiz:false};
  });
  GAME_DATA.tree.forEach(function(t){t.skills.forEach(function(sk,i){s.skills[t.id+i]=sk[1];});});
  return s;
}
function migrateV1(s){
  try{
    var raw=localStorage.getItem(OLDKEY);
    if(!raw) return s;
    var o=JSON.parse(raw);
    if(o.xp) s.xp=Math.min(o.xp, 400);
    if(o.streak) s.streak=o.streak;
    if(o.lastFull) s.lastFull=o.lastFull;
    if(o.skills) for(var k in o.skills){ if(s.skills[k]!==undefined) s.skills[k]=o.skills[k]; }
    if(o.levels) GAME_DATA.levels.forEach(function(l){
      if(o.levels[l.id] && o.levels[l.id].done) s.levels[l.id].quiz=true;
    });
    s.intro=false;
  }catch(e){}
  return s;
}
function load(){
  try{var raw=localStorage.getItem(KEY); if(raw) S=JSON.parse(raw);}catch(e){}
  if(!S){ S=migrateV1(freshState()); save(); }
  var f=freshState();
  for(var k in f){ if(S[k]===undefined) S[k]=f[k]; }
  GAME_DATA.levels.forEach(function(l){
    if(!S.levels[l.id]) S.levels[l.id]=f.levels[l.id];
    var st=S.levels[l.id];
    while(st.les.length<l.lessons.length) st.les.push(false);
    while(st.ex.length<l.exercises.length) st.ex.push({p:false,m:-1});
  });
  rolloverDaily(); rolloverWeekly();
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dstr(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(n){ var d=new Date(); d.setDate(d.getDate()+n); return dstr(d); }
function mondayKey(){ var d=new Date(); var day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return dstr(d); }
function rolloverDaily(){
  var t=todayStr();
  if(S.daily.date!==t){
    if(S.lastFull){
      var y=new Date(); y.setDate(y.getDate()-1);
      if(S.lastFull!==dstr(y) && S.lastFull!==t) S.streak=0;
    }
    S.daily={date:t,steps:[false,false,false,false]}; save();
  }
}
function rolloverWeekly(){
  var k=mondayKey();
  if(S.weekly.key!==k){ S.weekly={key:k,items:GAME_DATA.weekly.map(function(){return false;})}; save(); }
}

/* ================= xp & rank ================= */
function addXP(n,msg){ S.xp+=n; save(); renderHeader(); if(msg) toast("+"+n+" XP · "+msg); }
function subXP(n){ S.xp=Math.max(0,S.xp-n); save(); renderHeader(); }
function rankInfo(){
  var r=GAME_DATA.ranks,cur=r[0],next=null;
  for(var i=0;i<r.length;i++){ if(S.xp>=r[i][0]) cur=r[i]; else {next=r[i]; break;} }
  return {cur:cur,next:next};
}
function renderHeader(){
  document.getElementById("xpNum").textContent=S.xp;
  var ri=rankInfo();
  document.getElementById("rankName").textContent=ri.cur[1];
  var nEl=document.getElementById("rankNext"), bar=document.getElementById("xpBar");
  if(ri.next){
    nEl.textContent="距「"+ri.next[1]+"」还差 "+(ri.next[0]-S.xp)+" XP";
    bar.style.width=Math.min(100,Math.round((S.xp-ri.cur[0])/(ri.next[0]-ri.cur[0])*100))+"%";
  } else { nEl.textContent="已达最高称号 🎉"; bar.style.width="100%"; }
}

function capabilityTemplate(j){ return CAPABILITY_TEMPLATES[j]||CAPABILITY_TEMPLATES[0]; }
function noteValueValid(value,min){
  var text=String(value||"").trim();
  if(text.length<(min||12)) return false;
  var invalid=["这个问题不适合这个知识点","不适合这个知识点","所有场景","暂无内容","不知道怎么写"];
  return !invalid.some(function(word){return text.indexOf(word)>=0;});
}
function capabilityMissingFields(n,j){
  var t=capabilityTemplate(j);
  return t.fields.filter(function(f){
    return f.required&&!noteValueValid(n&&n[f.key],f.min);
  });
}
function noteComplete(n,j){
  return !!n && capabilityMissingFields(n,j).length===0;
}
function notesDone(l){
  if(l.id!=="l1") return l.lessons.length;
  return l.lessons.filter(function(_,j){return noteComplete(S.lessonNotes[noteKey(l,j)],j);}).length;
}
function allLes(l){ return lesDone(l)===l.lessons.length; }
function allNotes(l){ return l.id!=="l1" || notesDone(l)===l.lessons.length; }
function allEx(l){ return exDone(l)===l.exercises.length; }
function isDone(l){ return allLes(l)&&allNotes(l)&&allEx(l)&&S.levels[l.id].quiz; }
function levelUnlocked(i){ return i===0 || isDone(GAME_DATA.levels[i-1]); }

function readCapabilityNote(j,old){

/* ================= exercise engine ================= */
var EX={li:0,ei:0,idx:0,mistakes:0,queue:[],selL:-1,okPairs:0};
function startExercise(li,ei){
  var ex=GAME_DATA.levels[li].exercises[ei];
  EX={li:li,ei:ei,idx:0,mistakes:0,queue:[],selL:-1,okPairs:0};
  if(ex.type==="classify"){ EX.queue=ex.items.map(function(_,i){return i;}); renderClassify(); }
  else if(ex.type==="order") renderOrder();
  else if(ex.type==="match") renderMatch();
  else if(ex.type==="json") renderJson();
  else if(ex.type==="essay") renderEssay();
}
function exHead(ex){
  var l=GAME_DATA.levels[EX.li];
  return '<div class="wk">'+l.icon+" "+l.title+' · 互动练习</div><h2>'+ex.icon+" "+ex.t+'</h2>'
    +'<div class="goalbox">'+ex.intro+'</div>';
}
function passLimit(n){ return Math.max(1,Math.ceil(n/3)); }
function finishExercise(passed,extraHtml){
  var l=GAME_DATA.levels[EX.li], ex=l.exercises[EX.ei], st=S.levels[l.id].ex[EX.ei];
  var html;
  if(passed){
    var first=!st.p;
    st.p=true; st.m=EX.mistakes; save();
    if(first) addXP(25,"练习通过");
    html='<div class="result-emoji">🎯</div><div class="result-tt">练习通过！</div>'
      +'<div class="result-sub">失误 '+EX.mistakes+' 次'+(first?" · +25 XP":"（复练不重复计分）")
      +(extraHtml||"")+'</div>'
      +'<button class="btn primary" id="exBack">返回关卡 →</button>';
    confetti();
  } else {
    html='<div class="result-emoji">💪</div><div class="result-tt">失误 '+EX.mistakes+' 次，未达标</div>'
      +'<div class="result-sub">通过标准：失误不超过 '+passLimit(exSize(ex))+' 次。<br>错题解析都看过了，回去翻翻课卡再来。</div>'
      +'<button class="btn primary" id="exAgain">🔁 再来一次</button>'
      +'<button class="btn ghost" id="exBack">返回关卡复习</button>';
  }
  openSheet(html);
  document.getElementById("exBack").onclick=function(){ openLevel(EX.li); renderMap(); renderMe(); };
  var ag=document.getElementById("exAgain");
  if(ag) ag.onclick=function(){ startExercise(EX.li,EX.ei); };
}
function exSize(ex){
  if(ex.type==="classify") return ex.items.length;
  if(ex.type==="order") return ex.steps.length;
  if(ex.type==="match") return ex.pairs.length;
  return 1;
}
/* ---- classify ---- */
function renderClassify(){
  var ex=GAME_DATA.levels[EX.li].exercises[EX.ei];
  if(EX.idx>=EX.queue.length){ finishExercise(EX.mistakes<=passLimit(ex.items.length)); return; }
  var it=ex.items[EX.queue[EX.idx]];
  var html=exHead(ex)
    +'<div class="mistake-tag">进度 '+(EX.idx+1)+"/"+EX.queue.length+' · 失误 <b>'+EX.mistakes+'</b></div>'
    +'<div class="item-card">'+it.x+'</div><div class="cat-row">';
  ex.cats.forEach(function(c,i){ html+='<button class="cat-btn" data-c="'+i+'">'+c+'</button>'; });
  html+='</div><div id="exFb"></div>';
  openSheet(html);
  sheet.querySelectorAll(".cat-btn").forEach(function(b){
    b.onclick=function(){
      var pick=+b.dataset.c, right=pick===it.c;
      sheet.querySelectorAll(".cat-btn").forEach(function(x){
        x.disabled=true;
        if(+x.dataset.c===it.c) x.classList.add("right");
        else if(+x.dataset.c===pick){ x.classList.add("wrong"); x.classList.add("shake"); }
      });
      if(!right) EX.mistakes++;
      document.getElementById("exFb").innerHTML=
        '<div class="explain"><b>'+(right?"✅ 正确":"❌ 应选「"+ex.cats[it.c]+"」")+'</b> · '+it.e+'</div>'
        +'<button class="btn primary" id="exNext">'+(EX.idx+1<EX.queue.length?"下一个 →":"查看结果")+'</button>';
      document.getElementById("exNext").onclick=function(){ EX.idx++; renderClassify(); };
    };
  });
}
/* ---- order ---- */
function renderOrder(){
  var ex=GAME_DATA.levels[EX.li].exercises[EX.ei];
  var shuffled=ex.steps.map(function(s,i){return i;}).sort(function(){return Math.random()-.5;});
  var html=exHead(ex)
    +'<div class="mistake-tag">失误 <b id="omk">'+EX.mistakes+'</b></div>'
    +'<div id="ordDone"></div><div class="pool" id="ordPool">';
  shuffled.forEach(function(si){ html+='<button class="opt" data-s="'+si+'">'+ex.steps[si]+'</button>'; });
  html+='</div>';
  openSheet(html);
  var next=0;
  sheet.querySelectorAll("#ordPool .opt").forEach(function(b){
    b.onclick=function(){
      var si=+b.dataset.s;
      if(si===next){
        b.classList.add("usedS");
        document.getElementById("ordDone").innerHTML+=
          '<div class="order-done">'+(next+1)+". "+ex.steps[si]+'</div>';
        next++;
        if(next===ex.steps.length){
          var pass=EX.mistakes<=passLimit(ex.steps.length);
          setTimeout(function(){
            finishExercise(pass, pass&&ex.e?'<br><br>💡 '+ex.e:'');
          },400);
        }
      } else {
        EX.mistakes++;
        document.getElementById("omk").textContent=EX.mistakes;
        b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
      }
    };
  });
}
/* ---- match ---- */
function renderMatch(){
  var ex=GAME_DATA.levels[EX.li].exercises[EX.ei];
  var rOrder=ex.pairs.map(function(_,i){return i;}).sort(function(){return Math.random()-.5;});
  var html=exHead(ex)
    +'<div class="mistake-tag">配对 <b id="mok">0</b>/'+ex.pairs.length+' · 失误 <b id="mmk">'+EX.mistakes+'</b></div>'
    +'<div class="match-grid">';
  ex.pairs.forEach(function(p,i){ html+='<div class="m-cell mL" data-i="'+i+'"><b>'+p[0]+'</b></div>'; });
  html+='</div><div style="height:10px"></div><div class="match-grid">';
  rOrder.forEach(function(ri){ html+='<div class="m-cell mR" data-i="'+ri+'">'+ex.pairs[ri][1]+'</div>'; });
  html+='</div>';
  openSheet(html);
  EX.selL=-1; EX.okPairs=0;
  var selEl=null;
  sheet.querySelectorAll(".mL").forEach(function(c){
    c.onclick=function(){
      sheet.querySelectorAll(".mL").forEach(function(x){x.classList.remove("sel");});

    };
  });
  sheet.querySelectorAll(".mR").forEach(function(c){

        }
      } else {
        EX.mistakes++;
        document.getElementById("mmk").textContent=EX.mistakes;
        c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake");
      }
    };
  });
}
/* ---- json ---- */
function renderJson(){
  var ex=GAME_DATA.levels[EX.li].exercises[EX.ei];
  var st=S.levels[GAME_DATA.levels[EX.li].id].ex[EX.ei];

function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){

  } else fallbackCopy(t);
}
function fallbackCopy(t){
  var ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta);
  ta.select(); try{document.execCommand("copy"); toast("已复制，粘贴到当前 Codex 对话吧 🤖");}catch(e){toast("复制失败，请手动复制");}
  document.body.removeChild(ta);
}

function startQuiz(li){

function renderQuestion(){
  var l=GAME_DATA.levels[Q.li], qi=Q.order[Q.idx], qd=l.quiz[qi];
  var prog='<div class="q-prog">';
  for(var i=0;i<Q.order.length;i++) prog+='<i class="'+(i<Q.idx?"ok":i===Q.idx?"cur":"")+'"></i>';
  prog+='</div>';
  var html='<div class="wk">'+l.icon+" "+l.title+' · 第 '+(Q.idx+1)+"/"+Q.order.length+' 题</div>'+prog
    +'<div class="q-text">'+qd.q+'</div><div id="optWrap">';
  qd.o.forEach(function(o,i){ html+='<button class="opt" data-i="'+i+'">'+"ABCD"[i]+". "+o+'</button>'; });
  html+='</div><div id="qNext"></div>';
  openSheet(html);
  sheet.querySelectorAll(".opt").forEach(function(b){
    b.onclick=function(){
      var pick=+b.dataset.i, right=pick===qd.a;
      sheet.querySelectorAll(".opt").forEach(function(x){
        x.disabled=true;
        if(+x.dataset.i===qd.a) x.classList.add("right");
        else if(+x.dataset.i===pick) x.classList.add("wrong");
      });
      if(right) Q.correct++;
      else {
        var key="wq_"+l.id+"_"+qi;
        if(!S.extraCards.some(function(c){return c.key===key;})){
          S.extraCards.push({key:key,f:qd.q,b:"正确答案："+qd.o[qd.a]+"。"+qd.e});
          S.cards[key]={box:0,due:todayStr()}; save();
        }
      }
      var nx=document.getElementById("qNext");
      nx.innerHTML='<div class="explain"><b>'+(right?"✅ 答对了":"❌ 答错了（已加入复习卡组）")+'</b> · '+qd.e+'</div>'
        +'<button class="btn primary" id="nextQ">'+(Q.idx+1<Q.order.length?"下一题 →":"查看结果")+'</button>';
      document.getElementById("nextQ").onclick=function(){
        Q.idx++;
        if(Q.idx<Q.order.length) renderQuestion(); else quizResult();
      };
      nx.scrollIntoView({behavior:"smooth",block:"end"});
    };
  });
}
function quizResult(){
  var l=GAME_DATA.levels[Q.li], st=S.levels[l.id];
  var total=Q.order.length, pass=Q.correct===total, html;
  if(pass){
    var first=!st.quiz;
    st.quiz=true; save();
    if(first) addXP(30*total,"通关 "+l.title);
    html='<div class="result-emoji">🏆</div><div class="result-tt">通关成功！</div>'
      +'<div class="result-sub">'+total+' 题全对'+(first?"，获得 "+(30*total)+" XP！":"（复习挑战，不重复计分）")
      +(Q.li<GAME_DATA.levels.length-1 && isDone(l)?'<br>🔓 已解锁下一关：'+GAME_DATA.levels[Q.li+1].title
        :Q.li===GAME_DATA.levels.length-1 && isDone(l)?'<br>🎓 你打败了最终 BOSS，完成 32 周全路径闯关！':"")
      +'</div><button class="btn primary" id="rOk">继续冒险 →</button>';
    confetti();
  } else {
    html='<div class="result-emoji">💪</div><div class="result-tt">'+Q.correct+" / "+total+'</div>'
      +'<div class="result-sub">通关需要全对。错题已自动加入复习卡组，<br>去「复习打卡」页刷两轮再来。</div>'
      +'<button class="btn primary" id="rAgain">🔁 再来一次</button>'
      +'<button class="btn ghost" id="rOk">先去复习</button>';
  }
  openSheet(html);
  document.getElementById("rOk").onclick=function(){ closeSheet(); renderMap(); renderMe(); renderDaily(); };
  var ag=document.getElementById("rAgain");
  if(ag) ag.onclick=function(){ startQuiz(Q.li); };
}
function confetti(){
  var em=["🎉","⭐","✨","🎊","🏆","💜"];
  for(var i=0;i<28;i++){
    var s=document.createElement("div");
    s.className="confetti"; s.textContent=em[i%em.length];
    s.style.left=Math.random()*100+"vw";
    s.style.animationDuration=(1.6+Math.random()*1.6)+"s";
    s.style.animationDelay=(Math.random()*.5)+"s";
    document.body.appendChild(s);
    (function(el){ setTimeout(function(){el.remove();},3600); })(s);
  }
}

/* ================= review (spaced repetition) ================= */
var INTERVALS=[1,2,4,7,15];
function cardContent(key){
  if(key.indexOf("wq_")===0){
    var ec=S.extraCards.filter(function(c){return c.key===key;})[0];
    return ec?{f:ec.f,b:ec.b}:null;
  }
  var m=key.match(/^(l\d+)c(\d+)$/);
  if(!m) return null;
  var lv=GAME_DATA.levels.filter(function(l){return l.id===m[1];})[0];
  if(!lv||!lv.lessons[+m[2]]) return null;
  return {f:lv.lessons[+m[2]].card[0],b:lv.lessons[+m[2]].card[1]};
}
function dueCards(){
  var t=todayStr(), out=[];
  for(var k in S.cards){ if(S.cards[k].due<=t && cardContent(k)) out.push(k); }
  return out;
}
var RV={queue:[],idx:0,doneN:0};
function startReview(){
  RV={queue:dueCards().sort(function(){return Math.random()-.5;}),idx:0,doneN:0};
  if(!RV.queue.length){ toast("今天没有到期的复习卡 🎉"); return; }
  renderCard(false);
}
function renderCard(showBack){
  if(RV.idx>=RV.queue.length){
    openSheet('<div class="result-emoji">🧠</div><div class="result-tt">今日复习完成！</div>'
      +'<div class="result-sub">复习了 '+RV.doneN+' 张卡。记忆按「忘了明天见、记得越推越远」自动排期。</div>'
      +'<button class="btn primary" id="rvOk">返回 →</button>');
    document.getElementById("rvOk").onclick=function(){ closeSheet(); renderDaily(); renderMe(); };
    return;
  }
  var key=RV.queue[RV.idx], c=cardContent(key), cd=S.cards[key];
  var html='<div class="wk">📚 复习 · 第 '+(RV.idx+1)+"/"+RV.queue.length+' 张</div>'
    +'<div class="fc-meta">熟练度 '+"▁▂▃▅▇"[Math.min(cd.box,4)]+' · 盒子 '+(cd.box+1)+"/5"+'</div>'
    +'<div class="fc'+(showBack?" back-side":"")+'">'+(showBack?c.b:c.f)+'</div>';
  if(!showBack){
    html+='<button class="btn primary" id="fcFlip">翻开答案</button>';
  } else {
    html+='<div class="fc-btns"><button class="btn forget" id="fcNo">😵 忘了<br><span style="font-size:10px;font-weight:400">明天再见</span></button>'
      +'<button class="btn remember" id="fcYes">😎 记得<br><span style="font-size:10px;font-weight:400">'+INTERVALS[Math.min(cd.box+1,4)]+' 天后见</span></button></div>';
  }
  openSheet(html);
  if(!showBack){
    document.getElementById("fcFlip").onclick=function(){ renderCard(true); };
  } else {
    document.getElementById("fcNo").onclick=function(){
      cd.box=0; cd.due=addDays(1); save(); RV.doneN++; RV.idx++; addXP(2,"复习"); renderCard(false);
    };
    document.getElementById("fcYes").onclick=function(){
      cd.box=Math.min(cd.box+1,4); cd.due=addDays(INTERVALS[cd.box]); save();
      RV.doneN++; RV.idx++; addXP(3,"复习"); renderCard(false);
    };
  }
}

/* ================= tree ================= */
function renderTree(){
  var wrap=document.getElementById("treeWrap"); wrap.innerHTML="";
  GAME_DATA.tree.forEach(function(t){
    var states=t.skills.map(function(_,i){return S.skills[t.id+i]||0;});
    var pct=Math.round(states.reduce(function(a,b){return a+b;},0)/(t.skills.length*2)*100);
    var div=document.createElement("div"); div.className="layer";
    var chips="";
    t.skills.forEach(function(sk,i){
      var s=states[i];
      chips+='<div class="chip s'+s+'" data-k="'+t.id+i+'">'+(s===2?"● ":s===1?"◐ ":"○ ")+sk[0]+'</div>';
    });
    div.innerHTML='<div class="layer-hd"><div><h3 style="color:'+t.color+'">'+t.name+'</h3>'
      +'<div class="sub">'+t.sub+'</div></div><div class="layer-pct" style="color:'+t.color+'">'+pct+'%</div></div>'
      +'<div class="layer-bar"><i style="width:'+pct+'%;background:'+t.color+'"></i></div>'
      +'<div class="chips">'+chips+'</div>';
    wrap.appendChild(div);
  });
  wrap.querySelectorAll(".chip").forEach(function(c){
    c.onclick=function(){
      var k=c.dataset.k, old=S.skills[k]||0;
      S.skills[k]=(old+1)%3;
      if(S.skills[k]===2) addXP(15,"掌握新技能");
      save(); renderTree(); renderMe();
    };
  });
}

/* ================= daily ================= */
function renderDaily(){
  rolloverDaily(); rolloverWeekly();
  var d=new Date(), wd="日一二三四五六"[d.getDay()];
  document.getElementById("todayStr").textContent=(d.getMonth()+1)+" 月 "+d.getDate()+" 日 · 周"+wd;
  document.getElementById("streakN").textContent=S.streak;
  var due=dueCards().length;
  var bdg=document.getElementById("navBdg");
  if(due>0){ bdg.style.display="block"; bdg.textContent=due; } else bdg.style.display="none";
  document.getElementById("reviewCta").innerHTML=
    '<div class="review-cta" id="rvBtn"><div class="n">'+due+'</div>'
    +'<div><div class="t">📚 今日待复习卡片</div>'
    +'<div class="s">'+(due>0?"课卡 + 测验错题，间隔重复自动排期":"全部复习完毕，明天再来")+'</div></div>'
    +'<div style="margin-left:auto;font-size:20px">'+(due>0?"▶":"✅")+'</div></div>';
  document.getElementById("rvBtn").onclick=startReview;
  var allDone=S.daily.steps.every(function(x){return x;});
  document.getElementById("dailyDone").innerHTML=allDone
    ? '<div class="done-banner">🔥 今日 90 分钟完成！连续 '+S.streak+' 天</div>':"";
  var sw=document.getElementById("stepsWrap"); sw.innerHTML="";
  GAME_DATA.daily.forEach(function(s,i){
    var div=document.createElement("div");
    div.className="step"+(S.daily.steps[i]?" ck":"");
    div.innerHTML='<div class="box">'+(S.daily.steps[i]?"✓":"")+'</div>'
      +'<div><div class="tt">'+s[0]+'</div><div class="ds">'+s[1]+'</div></div>'
      +'<div class="min">'+s[2]+"′</div>";
    div.onclick=function(){
      S.daily.steps[i]=!S.daily.steps[i];
      if(S.daily.steps[i]) addXP(5,"每日打卡"); else subXP(5);
      if(S.daily.steps.every(function(x){return x;}) && S.lastFull!==S.daily.date){
        S.streak+=1; S.lastFull=S.daily.date;
        addXP(20,"今日全勤！连续 "+S.streak+" 天");
      }
      save(); renderDaily();
    };
    sw.appendChild(div);
  });
  var ww=document.getElementById("weeklyWrap"); ww.innerHTML="";
  GAME_DATA.weekly.forEach(function(w,i){
    var div=document.createElement("div");
    div.className="step"+(S.weekly.items[i]?" ck":"");
    div.innerHTML='<div class="box">'+(S.weekly.items[i]?"✓":"")+'</div><div><div class="tt">'+w+'</div></div>';
    div.onclick=function(){
      S.weekly.items[i]=!S.weekly.items[i];
      if(S.weekly.items[i]) addXP(10,"本周证据 +1"); else subXP(10);
      save(); renderDaily();
    };
    ww.appendChild(div);
  });
}

/* ================= me ================= */
function renderMe(){
  var lv=GAME_DATA.levels;
  document.getElementById("stLv").textContent=lv.filter(isDone).length+"/"+lv.length;
  var got=0,tot=0;
  GAME_DATA.tree.forEach(function(t){t.skills.forEach(function(_,i){tot+=2;got+=(S.skills[t.id+i]||0);});});
  document.getElementById("stSk").textContent=Math.round(got/tot*100)+"%";
  document.getElementById("stCard").textContent=Object.keys(S.cards).length;
  var ml=document.getElementById("meLevels"); ml.innerHTML="";
  lv.forEach(function(l,i){
    var un=levelUnlocked(i), fin=isDone(l);
    var row=document.createElement("div"); row.className="prow";
    row.innerHTML='<span>'+l.icon+'</span><span>'+l.title+'</span>'
      +'<span class="st" style="color:'+(fin?"var(--green)":un?"var(--accent2)":"var(--txt3)")+'">'
      +(fin?"★ 通关":un?("📖"+lesDone(l)+"/"+l.lessons.length+" 🎮"+exDone(l)+"/"+l.exercises.length+" ⚔️"+(S.levels[l.id].quiz?"✓":"–")):"🔒")+'</span>';
    ml.appendChild(row);
  });
}
document.getElementById("btnExport").onclick=function(){
  var j=JSON.stringify(S);
  document.getElementById("ioArea").value=j;
  copyText(j);
};
document.getElementById("btnImport").onclick=function(){
  try{
    var v=document.getElementById("ioArea").value.trim();
    if(!v){ toast("先把进度 JSON 粘贴到上方文本框"); return; }
    S=JSON.parse(v); save(); load(); renderAll(); toast("导入成功 ✅");
  }catch(e){ toast("JSON 格式不对，导入失败"); }
};
document.getElementById("btnReset").onclick=function(){
  if(confirm("确定重置全部进度？此操作不可恢复（建议先导出备份）")){
    S=freshState(); S.intro=true; save(); renderAll(); toast("已重置");
  }
};
document.getElementById("btnHelp").onclick=showIntro;

function showIntro(){
  openSheet('<h2>🎮 玩法说明 v2</h2><div class="goalbox" style="margin-top:12px">'
   +'<b>🗺️ 每关三段式</b>📖 学：读精读课卡（含类比和你的宠物场景案例），读完自动生成复习卡。🎮 练：页内互动练习——分类、排序、配对、写 JSON、写作——<span style="color:var(--accent2)">系统当场判分，失误超限必须重做</span>，不再自己打勾。⚔️ 战：测验全对才通关，错题自动进复习卡组。'
   +'</div><div class="goalbox">'
   +'<b>📚 复习路径</b>间隔重复：记得的卡 1→2→4→7→15 天后再见，忘了的明天再见。每天进「复习打卡」清掉到期卡片，红点提醒。'
   +'</div><div class="goalbox">'
   +'<b>✍️ 直接在 Codex 中问我</b>写作类练习先由系统按评分标准逐项检查；需要深度反馈时，点右下角「复制学习快照给 Codex」，切回当前 Codex 对话并粘贴，再附上你的问题或作业。我会持续解释、纠错和审核。'
   +'</div><div class="goalbox">'
   +'<b>⚡ XP</b>课卡 +8 · 练习通过 +25 · 测验每题 +30 · 复习 +2~3 · 技能掌握 +15 · 打卡 +5 · 全勤 +20 · 周证据 +10。'
   +'</div><div class="goalbox">'
   +'<b>🔁 可复制</b>进度可导出导入；所有关卡、课卡、题目都在文件顶部 GAME_DATA，改它即可复用这套玩法学任何东西。'
   +'</div><button class="btn primary" id="introOk" style="margin-top:14px">开始闯关 →</button>');
  document.getElementById("introOk").onclick=function(){ S.intro=true; save(); closeSheet(); };
}

var toastT=null;
function toast(m){
  var t=document.getElementById("toast");
  t.textContent=m; t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove("on");},1900);
}

function renderAll(){ renderHeader(); renderMap(); renderTree(); renderDaily(); renderMe(); }
load(); renderAll();
if(!S.intro) showIntro();
document.getElementById("codexCheckin").onclick=function(){
  var levels=GAME_DATA.levels.map(function(l){
    return "• "+l.title+"：课卡 "+lesDone(l)+"/"+l.lessons.length+"，练习 "+exDone(l)+"/"+l.exercises.length+"，测验 "+(S.levels[l.id].quiz?"已通过":"未通过");
  }).join("\n");
  var notes=GAME_DATA.levels[0].lessons.map(function(le,j){
    var n=S.lessonNotes[noteKey(GAME_DATA.levels[0],j)];
    var t=capabilityTemplate(j), missing=capabilityMissingFields(n,j);
    if(missing.length) return "• "+le.t+"：能力卡未完成（缺："+missing.map(function(f){return f.label;}).join("、")+"）";
    return "• "+le.t+"\n"+t.fields.map(function(f){
      return "  "+f.label+"："+String(n[f.key]||"未填写");
    }).join("\n");
  }).join("\n");
  var today=GAME_DATA.daily.map(function(d,i){return (S.daily.steps[i]?"✓ ":"□ ")+d[0];}).join("\n");
  var snapshot="我正在使用《GOGO GO · AI 从业者闯关之路》学习。请继续作为我的长期 AI 从业者教练。\n\n【我的学习快照】\n经验值："+S.xp+"\n连续学习："+S.streak+" 天\n\n【各关进度】\n"+levels+"\n\n【第一关能力卡】\n"+notes+"\n\n【今日学习】\n"+today+"\n\n【我现在的问题或要提交的作业】\n（请在这里补充）\n\n请先根据我的进度判断最合适的下一步；如果我提交作业，按概念准确性、逻辑、可落地性和能力证据严格反馈；不要一次塞入多个新概念。";
  copyText(snapshot);
  toast("学习快照已复制，粘贴到当前 Codex 对话即可");
};
